<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Avaliar · Congresso ABVCAP 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="styles.css?v=12" />
  <style>
    .stars { display: flex; gap: 8px; }
    .star {
      appearance: none; border: none; background: none; cursor: pointer;
      font-size: 34px; line-height: 1; padding: 2px; color: var(--line);
      transition: color 0.1s ease, transform 0.06s ease;
    }
    .star:hover { transform: scale(1.08); }
    .star.selected { color: var(--verde); }
    .rating-hint { font-size: 13px; color: var(--ink-faint); margin-top: 6px; min-height: 18px; }
  </style>
</head>
<body>
  <div class="site-topbar">
    <div class="site-topbar-inner">
      <img src="assets/logo-negativo.png" alt="ABVCAP" class="brand-logo" />
      <div class="lang-toggle" id="lang-toggle"></div>
    </div>
  </div>
  <div class="site-topbar-stripe"></div>
  <div class="wrap">
    <div class="header">
      <span class="eyebrow" id="context-eyebrow">Congresso ABVCAP 2026 · 22 e 23 de setembro</span>
      <h1 id="context-title">Avalie o evento</h1>
      <p class="speakers" id="context-speakers" style="display: none;"></p>
      <p id="context-subtitle"></p>
    </div>

    <div class="card" style="padding: 22px;" id="form-card">
      <form id="evaluation-form">
        <div class="field">
          <label id="rating-label">Nota geral para o evento</label>
          <div class="stars" id="stars">
            <button type="button" class="star" data-value="1">★</button>
            <button type="button" class="star" data-value="2">★</button>
            <button type="button" class="star" data-value="3">★</button>
            <button type="button" class="star" data-value="4">★</button>
            <button type="button" class="star" data-value="5">★</button>
          </div>
          <div class="rating-hint" id="rating-hint">Toque em uma estrela para avaliar</div>
        </div>
        <div class="field">
          <label for="liked"><span id="liked-label">O que você mais gostou?</span> <span id="liked-optional" style="font-weight: 400; text-transform: none; letter-spacing: normal;">(opcional)</span></label>
          <textarea id="liked" rows="3" maxlength="500" placeholder="Conteúdo, painelistas, organização…"></textarea>
        </div>
        <div class="field">
          <label for="improve"><span id="improve-label">O que podemos melhorar?</span> <span id="improve-optional" style="font-weight: 400; text-transform: none; letter-spacing: normal;">(opcional)</span></label>
          <textarea id="improve" rows="3" maxlength="500" placeholder="Sugestões para a próxima vez…"></textarea>
        </div>
        <div class="field">
          <label for="author"><span id="author-label">Seu nome</span> <span id="author-optional" style="font-weight: 400; text-transform: none; letter-spacing: normal;">(opcional)</span></label>
          <input type="text" id="author" maxlength="120" placeholder="Ex.: Maria Silva" />
        </div>
        <input type="text" id="website" name="website" class="honeypot" tabindex="-1" autocomplete="off" />
        <button type="submit" class="btn btn-accent btn-block" id="submit-btn">Enviar avaliação</button>
      </form>
      <div id="success" style="display:none; text-align:center; padding: 12px 0;">
        <h3 style="margin-bottom: 8px;" id="success-title">Obrigado pela avaliação!</h3>
        <p style="color: var(--ink-soft); margin: 0 0 18px;" id="success-text">Sua opinião foi registrada e vai ajudar a melhorar o próximo Congresso ABVCAP 2026.</p>
        <a class="btn btn-ghost btn-block" href="avaliacao.html" id="success-general-link" style="display:none; text-decoration: none;">Avaliar o evento inteiro →</a>
      </div>
    </div>

    <a class="btn btn-ghost btn-block" href="index.html" id="back-link" style="display: block; margin-top: 16px; text-align: center; text-decoration: none;">← Ver todos os painéis</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=17"></script>
  <script>
    (async function () {
      document.documentElement.lang = getLang() === "en" ? "en" : "pt-BR";
      renderLangToggle();
      document.getElementById("liked-label").textContent = t("likedQuestion");
      document.getElementById("liked-optional").textContent = t("optional");
      document.getElementById("liked").placeholder = t("likedPlaceholder");
      document.getElementById("improve-label").textContent = t("improveQuestion");
      document.getElementById("improve-optional").textContent = t("optional");
      document.getElementById("improve").placeholder = t("improvePlaceholder");
      document.getElementById("author-label").textContent = t("yourName");
      document.getElementById("author-optional").textContent = t("optional");
      document.getElementById("author").placeholder = t("yourNamePlaceholder");
      document.getElementById("submit-btn").textContent = t("sendEvaluation");
      document.getElementById("success-general-link").textContent = t("evaluateWholeEvent");
      document.getElementById("back-link").textContent = t("footerHome");
      document.getElementById("context-eyebrow").textContent = `${t("eventName")} · ${t("eventDates")}`;
      document.title = `${document.title.split(" · ")[0]} · ${t("eventName")}`;
      document.getElementById("context-title").textContent = t("evaluateEventTitle");
      document.getElementById("context-subtitle").textContent = t("evaluateEventSubtitle");
      document.getElementById("rating-label").textContent = t("ratingForEvent");
      document.getElementById("rating-hint").textContent = t("tapAStar");
      document.getElementById("success-title").textContent = t("thankYouEvaluation");
      document.getElementById("success-text").textContent = t("evaluateEventSuccessText");

      const panelId = qs("p");
      let panel = null;

      if (panelId) {
        panel = await fetchPanel(panelId);
        const eyebrowEl = document.getElementById("context-eyebrow");
        const titleEl = document.getElementById("context-title");
        const subtitleEl = document.getElementById("context-subtitle");
        const ratingLabelEl = document.getElementById("rating-label");

        if (!panel) {
          titleEl.textContent = t("panelNotFound");
          document.getElementById("form-card").style.display = "none";
          return;
        }

        eyebrowEl.textContent = `${t("eventName")} · ${formatRange(panel)}`;
        titleEl.textContent = panelName(panel);
        if (panel.speakers) {
          const speakersEl = document.getElementById("context-speakers");
          speakersEl.textContent = `${t("speakersLabel")}: ${formatSpeakers(panel)}`;
          speakersEl.style.display = "block";
        }
        subtitleEl.textContent = t("evaluatePanelSubtitle");
        ratingLabelEl.textContent = t("ratingForPanel");
        document.getElementById("success-title").textContent = t("thankYouEvaluation");
        document.getElementById("success-text").textContent = t("evaluatePanelSuccessText");
        document.getElementById("success-general-link").style.display = "block";
      }

      let rating = 0;
      const starsEl = document.getElementById("stars");
      const hintEl = document.getElementById("rating-hint");
      const stars = Array.from(starsEl.querySelectorAll(".star"));

      function paintStars(value) {
        stars.forEach((s) => s.classList.toggle("selected", Number(s.dataset.value) <= value));
      }

      stars.forEach((s) => {
        s.addEventListener("click", () => {
          rating = Number(s.dataset.value);
          paintStars(rating);
          hintEl.textContent = `${t("ratingN")} ${rating}/5`;
        });
        s.addEventListener("mouseenter", () => paintStars(Number(s.dataset.value)));
      });
      starsEl.addEventListener("mouseleave", () => paintStars(rating));

      const form = document.getElementById("evaluation-form");
      const submitBtn = document.getElementById("submit-btn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const website = document.getElementById("website").value;
        if (website) return; // honeypot tripped, silently ignore

        if (!rating) {
          hintEl.textContent = t("pickRatingFirst");
          hintEl.style.color = "var(--danger)";
          return;
        }

        const liked = document.getElementById("liked").value.trim();
        const improve = document.getElementById("improve").value.trim();
        const author = document.getElementById("author").value.trim();

        submitBtn.disabled = true;
        submitBtn.textContent = t("sending");

        const { error } = await sb.from("vcday_evaluations").insert({
          event_slug: EVENT_SLUG,
          panel_id: panel ? panel.id : null,
          rating,
          liked: liked || null,
          improve: improve || null,
          author_name: author || null,
        });

        submitBtn.disabled = false;
        submitBtn.textContent = t("sendEvaluation");

        if (error) {
          console.error(error);
          alert(t("sendError"));
          return;
        }

        form.style.display = "none";
        document.getElementById("success").style.display = "block";
      });
    })();
  </script>
</body>
</html>
