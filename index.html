<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perguntas · VC Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="styles.css?v=9" />
</head>
<body>
  <div class="site-topbar"><div class="site-topbar-inner"><img src="assets/logo-negativo.png" alt="ABVCAP" class="brand-logo" /></div></div>
  <div class="site-topbar-stripe"></div>
  <div class="wrap">
    <div class="header">
      <span class="eyebrow">VC Day · 16 de setembro</span>
      <h1>Pergunte aos painelistas</h1>
      <p>Selecione o painel em andamento (ou o próximo) e envie sua pergunta. A equipe de moderação fará a seleção das perguntas que serão enviadas aos painelistas.</p>
    </div>

    <div id="panels" class="panel-list">
      <div class="card" style="padding: 18px; color: var(--ink-faint);">Carregando painéis…</div>
    </div>

    <a class="btn btn-ghost btn-block" href="avaliacao.html" style="display: block; margin-top: 20px; text-align: center; text-decoration: none;">Avaliar o evento →</a>

    <a class="footer-link" href="https://www.abvcap.com.br" target="_blank" rel="noopener">ABVCAP Experience 2026 - VC Day</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=10"></script>
  <script>
    (async function () {
      const panels = await fetchPanels();
      const nowMin = nowMinutesSaoPaulo();
      const list = document.getElementById("panels");

      if (!panels.length) {
        list.innerHTML = '<div class="card" style="padding:18px;color:var(--ink-faint);">Nenhum painel cadastrado ainda.</div>';
        return;
      }

      list.innerHTML = panels
        .map((p) => {
          const phase = panelPhase(p, nowMin);
          const tag =
            phase === "live" ? '<span class="tag live">Agora</span>' :
            phase === "soon" ? '<span class="tag soon">Em breve</span>' :
            '<span class="tag done">Encerrado</span>';
          const liveClass = phase === "live" ? " is-live" : "";
          const titleBlock = `
            <span class="title-block">
              <span class="title">${escapeHtml(p.name)}</span>
              ${p.speakers ? `<span class="speakers">Speakers: ${escapeHtml(p.speakers)}</span>` : ""}
            </span>
          `;
          if (phase === "done") {
            return `
              <div class="card panel-row panel-row-disabled">
                <span class="time">${formatRange(p)}</span>
                ${titleBlock}
                <span class="row-actions">
                  ${tag}
                  <a class="evaluate-link" href="avaliacao.html?p=${encodeURIComponent(p.id)}">Avaliar →</a>
                </span>
              </div>
            `;
          }
          return `
            <a class="card panel-row${liveClass}" href="pergunta.html?p=${encodeURIComponent(p.id)}">
              <span class="time">${formatRange(p)}</span>
              ${titleBlock}
              ${tag}
            </a>
          `;
        })
        .join("");
    })();
  </script>
</body>
</html>
