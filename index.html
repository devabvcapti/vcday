<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perguntas · Congresso ABVCAP 2026</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon-512.png" />
  <link rel="apple-touch-icon" href="assets/favicon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="styles.css?v=13" />
</head>
<body>
  <div class="site-topbar">
    <div class="site-topbar-inner">
      <img src="assets/logo-negativo.png" alt="ABVCAP" class="brand-logo" />
      <div class="lang-toggle" id="lang-toggle"></div>
    </div>
  </div>
  <div class="site-topbar-stripe"></div>
  <div class="wrap">
    <div class="header">
      <span class="eyebrow" id="hub-eyebrow">Congresso ABVCAP 2026 · 22 e 23 de setembro</span>
      <h1 id="hub-title">Pergunte aos painelistas</h1>
      <p id="hub-subtitle">Selecione o painel em andamento (ou o próximo) e envie sua pergunta. A equipe de moderação fará a seleção das perguntas que serão enviadas aos painelistas.</p>
    </div>

    <div class="day-tabs" id="day-tabs"></div>

    <div id="panels" class="panel-list">
      <div class="card" style="padding: 18px; color: var(--ink-faint);">Carregando painéis…</div>
    </div>

    <a class="btn btn-ghost btn-block" href="avaliacao.html" id="evaluate-event-link" style="display: block; margin-top: 20px; text-align: center; text-decoration: none;">Avaliar o evento →</a>

    <a class="footer-link" href="https://www.abvcap.com.br" target="_blank" rel="noopener" id="footer-link">Congresso ABVCAP 2026</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=19"></script>
  <script>
    (async function () {
      document.documentElement.lang = getLang() === "en" ? "en" : "pt-BR";
      renderLangToggle();
      document.getElementById("hub-eyebrow").textContent = `${t("eventName")} · ${t("eventDates")}`;
      document.getElementById("hub-title").textContent = t("hubTitle");
      document.getElementById("hub-subtitle").textContent = t("hubSubtitle");
      document.getElementById("evaluate-event-link").textContent = t("evaluateEvent");
      document.getElementById("footer-link").textContent = t("eventName");
      document.title = `${document.title.split(" · ")[0]} · ${t("eventName")}`;

      const panels = await fetchPanels();
      const nowMin = nowMinutesSaoPaulo();
      const list = document.getElementById("panels");
      const dayTabsEl = document.getElementById("day-tabs");

      if (!panels.length) {
        list.innerHTML = `<div class="card" style="padding:18px;color:var(--ink-faint);">${t("noPanelsYet")}</div>`;
        return;
      }

      const days = uniqueEventDates(panels);
      const today = todayDateStringSaoPaulo();
      let selectedDay = days.includes(today) ? today : days[0];

      function renderDayTabs() {
        if (days.length < 2) return;
        dayTabsEl.innerHTML = days
          .map((d, i) => {
            return `<button type="button" class="day-tab${d === selectedDay ? " active" : ""}" data-day="${d}">${t("day")} ${i + 1} · ${formatDateForLang(d)}</button>`;
          })
          .join("");
        dayTabsEl.querySelectorAll(".day-tab").forEach((btn) => {
          btn.addEventListener("click", () => {
            selectedDay = btn.dataset.day;
            renderDayTabs();
            renderPanels();
          });
        });
      }

      function renderPanels() {
        const dayPanels = panels.filter((p) => p.event_date === selectedDay);
        list.innerHTML = dayPanels
        .map((p) => {
          const phase = panelPhase(p, nowMin);
          const tag =
            phase === "live" ? `<span class="tag live">${t("tagLive")}</span>` :
            phase === "soon" ? `<span class="tag soon">${t("tagSoon")}</span>` :
            `<span class="tag done">${t("tagDone")}</span>`;
          const liveClass = phase === "live" ? " is-live" : "";
          const titleBlock = `
            <span class="title-block">
              <span class="title">${escapeHtml(panelName(p))}</span>
              ${p.speakers ? `<span class="speakers">${t("speakersLabel")}: ${escapeHtml(formatSpeakers(p))}</span>` : ""}
            </span>
          `;
          if (phase === "done" || !p.qa_enabled) {
            return `
              <div class="card panel-row panel-row-disabled">
                <span class="time">${formatTimeOnly(p)}</span>
                ${titleBlock}
                <span class="row-actions">
                  ${tag}
                  <a class="evaluate-link" href="avaliacao.html?p=${encodeURIComponent(p.id)}">${t("evaluateShort")}</a>
                </span>
              </div>
            `;
          }
          return `
            <a class="card panel-row${liveClass}" href="pergunta.html?p=${encodeURIComponent(p.id)}">
              <span class="time">${formatTimeOnly(p)}</span>
              ${titleBlock}
              ${tag}
            </a>
          `;
        })
        .join("");
      }

      renderDayTabs();
      renderPanels();
    })();
  </script>
</body>
</html>
