<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moderação · Congresso ABVCAP 2026</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon-512.png" />
  <link rel="apple-touch-icon" href="assets/favicon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="styles.css?v=13" />
  <style>
    .wrap-wide { max-width: 860px; margin-inline: auto; padding-block: 28px 64px; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    .tab {
      font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
      cursor: pointer;
    }
    .tab.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .section-title {
      font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--ink-faint); margin: 28px 0 12px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .qrow {
      display: flex; gap: 16px; align-items: flex-start; padding: 16px 18px; margin-bottom: 10px;
    }
    .qrow .body { flex: 1; }
    .qrow .text { font-size: 15px; line-height: 1.5; margin-bottom: 6px; }
    .qrow .meta { font-size: 12px; color: var(--ink-faint); }
    .qrow .actions { display: flex; gap: 8px; flex-shrink: 0; }
    .qrow .actions .btn { padding: 8px 12px; font-size: 13px; white-space: nowrap; }
    .status-pill {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      padding: 2px 8px; border-radius: 999px; margin-left: 8px;
    }
    .status-pill.approved { background: var(--live-soft); color: var(--live); }
    .status-pill.rejected { background: var(--danger-soft); color: var(--danger); }
    .status-pill.answered { background: var(--line); color: var(--ink-faint); }
    .empty-note { color: var(--ink-faint); font-size: 14px; padding: 14px 18px; }
    #login-card { max-width: 360px; margin: 15vh auto 0; padding: 26px; text-align: center; }
    #login-card p { color: var(--ink-soft); font-size: 14px; margin: 8px 0 18px; }
    #login-error { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 18px; }

    .event-select-row { margin-bottom: 18px; }
    .event-select-row label {
      display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--ink-faint); margin-bottom: 6px;
    }
    #event-select {
      font-family: inherit; font-size: 14px; font-weight: 600; color: var(--navy);
      padding: 8px 12px; border-radius: 4px; border: 1px solid var(--line);
      background: var(--surface);
    }

    .view-switch { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--line); }
    .view-tab {
      appearance: none; border: none; background: none; cursor: pointer;
      font-family: inherit; font-size: 14px; font-weight: 600; color: var(--ink-faint);
      padding: 10px 4px; margin-right: 16px; border-bottom: 2px solid transparent;
    }
    .view-tab.active { color: var(--navy); border-bottom-color: var(--verde); }

    .eval-summary-grid { display: flex; gap: 32px; flex-wrap: wrap; }
    .eval-stat .value { font-family: "Source Serif 4", Georgia, serif; font-size: 28px; color: var(--navy); }
    .eval-stat .label { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.05em; }

    .erow { padding: 16px 18px; margin-bottom: 10px; }
    .erow .erow-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .erow .rating { color: var(--verde-escuro); font-weight: 700; }
    .erow .meta { font-size: 12px; color: var(--ink-faint); }
    .erow .label { font-size: 12px; font-weight: 700; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 8px; }
    .erow .text { font-size: 14px; line-height: 1.5; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="site-topbar"><div class="site-topbar-inner"><img src="assets/logo-negativo.png" alt="ABVCAP" class="brand-logo" /></div></div>
  <div class="site-topbar-stripe"></div>
  <div id="login-view" class="wrap">
    <div class="card" id="login-card">
      <span class="eyebrow">Congresso ABVCAP 2026</span>
      <h1 style="font-size: 22px; margin-top: 10px;">Moderação de perguntas</h1>
      <p>Digite a senha da equipe para aprovar e gerenciar as perguntas do público.</p>
      <div class="field" style="text-align: left;">
        <input type="text" id="passcode" placeholder="Senha da moderação" autocomplete="off" />
      </div>
      <button class="btn btn-accent btn-block" id="login-btn">Entrar</button>
      <div id="login-error"></div>
    </div>
  </div>

  <div id="admin-view" class="wrap-wide" style="display:none;">
    <div class="header">
      <span class="eyebrow">Congresso ABVCAP 2026 · Moderação</span>
      <h1 id="panel-name" style="font-size: 24px;">Carregando…</h1>
      <p class="speakers" id="panel-speakers" style="display: none;"></p>
    </div>

    <div class="event-select-row">
      <label for="event-select">Evento</label>
      <select id="event-select"></select>
    </div>

    <div class="view-switch">
      <button type="button" class="view-tab active" id="switch-questions">Perguntas</button>
      <button type="button" class="view-tab" id="switch-evaluations">Avaliações do evento</button>
    </div>

    <div id="questions-view">
      <div class="day-tabs" id="day-tabs"></div>
      <div class="tabs" id="panel-tabs"></div>

      <div class="section-title">
        <span>Pendentes <span id="count-pending" class="mono"></span></span>
      </div>
      <div id="list-pending"></div>

      <div class="section-title">
        <span>Fila aprovada (aparece no telão)</span>
      </div>
      <div id="list-approved"></div>

      <div class="section-title">
        <span>Histórico (respondidas / rejeitadas)</span>
      </div>
      <div id="list-history"></div>
    </div>

    <div id="evaluations-view" style="display: none;">
      <div class="card" id="evaluations-summary" style="padding: 18px; margin-bottom: 18px;"></div>
      <div class="section-title"><span>Comentários</span></div>
      <div id="list-evaluations"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=19"></script>
  <script>
    (function () {
      let passcode = sessionStorage.getItem("vcday_mod_passcode") || "";
      let panels = [];
      let activePanelId = qs("p") || "";
      let selectedEvent = KNOWN_EVENTS[0];
      let selectedDay = "";

      const dayTabsEl = document.getElementById("day-tabs");

      function pickDay() {
        const days = uniqueEventDates(panels);
        const today = todayDateStringSaoPaulo();
        selectedDay = days.includes(today) ? today : (days[0] || "");
      }

      function renderDayTabs() {
        const days = uniqueEventDates(panels);
        if (days.length < 2) {
          dayTabsEl.innerHTML = "";
          return;
        }
        dayTabsEl.innerHTML = days
          .map((d, i) => {
            const [, m, dd] = d.split("-");
            return `<button type="button" class="day-tab${d === selectedDay ? " active" : ""}" data-day="${d}">Dia ${i + 1} · ${dd}/${m}</button>`;
          })
          .join("");
        dayTabsEl.querySelectorAll(".day-tab").forEach((btn) => {
          btn.addEventListener("click", () => {
            selectedDay = btn.dataset.day;
            const dayPanels = panels.filter((p) => p.event_date === selectedDay);
            activePanelId = (dayPanels[0] || {}).id || "";
            history.replaceState(null, "", `?p=${activePanelId}`);
            renderDayTabs();
            renderTabs();
            loadQuestions();
          });
        });
      }

      const loginView = document.getElementById("login-view");
      const adminView = document.getElementById("admin-view");
      const loginError = document.getElementById("login-error");

      const eventSelectEl = document.getElementById("event-select");
      eventSelectEl.innerHTML = KNOWN_EVENTS.map(
        (ev, i) => `<option value="${i}">${escapeHtml(ev.label)}</option>`
      ).join("");
      eventSelectEl.addEventListener("change", async () => {
        selectedEvent = KNOWN_EVENTS[Number(eventSelectEl.value)];
        activePanelId = "";
        panels = await fetchPanels(selectedEvent.start, selectedEvent.end);
        if (!panels.length) {
          document.getElementById("panel-tabs").innerHTML = "";
          document.getElementById("panel-name").textContent = "Nenhum painel neste evento";
          ["list-pending", "list-approved", "list-history"].forEach(
            (id) => (document.getElementById(id).innerHTML = "")
          );
          return;
        }
        activePanelId = (pickDefaultPanel(panels) || panels[0]).id;
        pickDay();
        const activePanel = panels.find((p) => p.id === activePanelId);
        if (activePanel) selectedDay = activePanel.event_date;
        history.replaceState(null, "", `?p=${activePanelId}`);
        renderDayTabs();
        renderTabs();
        loadQuestions();
        if (switchEvaluations.classList.contains("active")) loadEvaluations();
      });

      async function tryLogin(code) {
        const panelsList = await fetchPanels(selectedEvent.start, selectedEvent.end);
        panels = panelsList;
        if (!panels.length) {
          loginError.textContent = "Nenhum painel cadastrado ainda.";
          return false;
        }
        if (!activePanelId) activePanelId = (pickDefaultPanel(panels) || panels[0]).id;
        const activePanel = panels.find((p) => p.id === activePanelId);
        selectedDay = activePanel ? activePanel.event_date : "";
        if (!selectedDay) pickDay();
        const { error } = await sb.rpc("vcday_admin_list_questions", {
          p_passcode: code,
          p_panel_id: activePanelId,
        });
        if (error) {
          loginError.textContent = "Senha incorreta.";
          return false;
        }
        passcode = code;
        sessionStorage.setItem("vcday_mod_passcode", code);
        return true;
      }

      document.getElementById("login-btn").addEventListener("click", doLogin);
      document.getElementById("passcode").addEventListener("keydown", (e) => {
        if (e.key === "Enter") doLogin();
      });

      async function doLogin() {
        const code = document.getElementById("passcode").value.trim();
        if (!code) return;
        loginError.textContent = "";
        const ok = await tryLogin(code);
        if (ok) startAdmin();
      }

      function renderTabs() {
        const tabsEl = document.getElementById("panel-tabs");
        const dayPanels = panels.filter((p) => p.event_date === selectedDay);
        tabsEl.innerHTML = dayPanels
          .map(
            (p) =>
              `<button class="tab${p.id === activePanelId ? " active" : ""}" data-id="${p.id}">${escapeHtml(p.name.split(":")[0])}</button>`
          )
          .join("");
        tabsEl.querySelectorAll(".tab").forEach((btn) => {
          btn.addEventListener("click", () => {
            activePanelId = btn.dataset.id;
            history.replaceState(null, "", `?p=${activePanelId}`);
            renderTabs();
            loadQuestions();
          });
        });
      }

      async function setStatus(id, status) {
        const { error } = await sb.rpc("vcday_admin_set_status", {
          p_passcode: passcode,
          p_question_id: id,
          p_status: status,
        });
        if (error) {
          alert("Sessão expirou ou senha inválida. Recarregue a página.");
          return;
        }
        loadQuestions();
      }

      function questionRow(q, actions) {
        return `
          <div class="card qrow">
            <div class="body">
              <div class="text">${escapeHtml(q.question_text)}</div>
              <div class="meta">${q.author_name ? escapeHtml(q.author_name) + " · " : "Anônimo · "}${timeAgo(q.created_at)}</div>
            </div>
            <div class="actions">${actions}</div>
          </div>
        `;
      }

      async function loadQuestions() {
        const panel = panels.find((p) => p.id === activePanelId);
        document.getElementById("panel-name").textContent = panel ? panel.name : "Painel";
        const speakersEl = document.getElementById("panel-speakers");
        if (panel && panel.speakers) {
          speakersEl.textContent = `Speakers: ${panel.speakers}`;
          speakersEl.style.display = "block";
        } else {
          speakersEl.style.display = "none";
        }

        const { data, error } = await sb.rpc("vcday_admin_list_questions", {
          p_passcode: passcode,
          p_panel_id: activePanelId,
        });
        if (error) {
          alert("Sessão expirou ou senha inválida. Recarregue a página.");
          return;
        }

        const pending = data.filter((q) => q.status === "pending");
        const approved = data.filter((q) => q.status === "approved");
        const history = data
          .filter((q) => q.status === "answered" || q.status === "rejected")
          .slice(-20)
          .reverse();

        document.getElementById("count-pending").textContent = pending.length ? `(${pending.length})` : "";

        document.getElementById("list-pending").innerHTML =
          pending.length
            ? pending
                .map((q) =>
                  questionRow(
                    q,
                    `<button class="btn btn-live" onclick="window.__setStatus('${q.id}','approved')">Aprovar</button>
                     <button class="btn btn-danger-ghost" onclick="window.__setStatus('${q.id}','rejected')">Rejeitar</button>`
                  )
                )
                .join("")
            : '<div class="empty-note">Nenhuma pergunta pendente.</div>';

        document.getElementById("list-approved").innerHTML =
          approved.length
            ? approved
                .map((q) =>
                  questionRow(
                    q,
                    `<button class="btn btn-ghost" onclick="window.__setStatus('${q.id}','answered')">Respondida</button>`
                  )
                )
                .join("")
            : '<div class="empty-note">Fila vazia.</div>';

        document.getElementById("list-history").innerHTML =
          history.length
            ? history
                .map((q) =>
                  questionRow(
                    q,
                    `<span class="status-pill ${q.status}">${q.status === "answered" ? "Respondida" : "Rejeitada"}</span>`
                  )
                )
                .join("")
            : '<div class="empty-note">Ainda sem histórico.</div>';
      }

      window.__setStatus = setStatus;

      function starString(rating) {
        return "★".repeat(rating) + "☆".repeat(5 - rating);
      }

      async function loadEvaluations() {
        const { data, error } = await sb.rpc("vcday_admin_list_evaluations", {
          p_passcode: passcode,
          p_event_slug: selectedEvent.slug,
        });
        if (error) {
          alert("Sessão expirou ou senha inválida. Recarregue a página.");
          return;
        }

        function avgOf(list) {
          return list.length ? (list.reduce((sum, e) => sum + e.rating, 0) / list.length).toFixed(1) : "—";
        }

        const general = data.filter((e) => !e.panel_id);
        const tiles = [
          { label: "Geral do evento", avg: avgOf(general), count: general.length },
          ...panels.map((p) => {
            const list = data.filter((e) => e.panel_id === p.id);
            return { label: p.name.split(":")[0], avg: avgOf(list), count: list.length };
          }),
        ];

        document.getElementById("evaluations-summary").innerHTML = `
          <div class="eval-summary-grid">
            ${tiles
              .map(
                (t) => `
                  <div class="eval-stat">
                    <div class="value">${t.avg}</div>
                    <div class="label">${escapeHtml(t.label)} ${t.count ? `(${t.count})` : ""}</div>
                  </div>
                `
              )
              .join("")}
          </div>
        `;

        document.getElementById("list-evaluations").innerHTML = data.length
          ? data
              .map((e) => {
                const panel = panels.find((p) => p.id === e.panel_id);
                const context = panel ? `Painel: ${panel.name.split(":")[0]}` : "Avaliação geral do evento";
                return `
                  <div class="card erow">
                    <div class="erow-head">
                      <span class="rating">${starString(e.rating)}</span>
                      <span class="meta">${e.author_name ? escapeHtml(e.author_name) + " · " : "Anônimo · "}${timeAgo(e.created_at)}</span>
                    </div>
                    <div class="label">${escapeHtml(context)}</div>
                    ${e.liked ? `<div class="label">Gostou</div><div class="text">${escapeHtml(e.liked)}</div>` : ""}
                    ${e.improve ? `<div class="label">Sugestão de melhoria</div><div class="text">${escapeHtml(e.improve)}</div>` : ""}
                  </div>
                `;
              })
              .join("")
          : '<div class="empty-note">Nenhuma avaliação recebida ainda.</div>';
      }

      const switchQuestions = document.getElementById("switch-questions");
      const switchEvaluations = document.getElementById("switch-evaluations");
      switchQuestions.addEventListener("click", () => {
        switchQuestions.classList.add("active");
        switchEvaluations.classList.remove("active");
        document.getElementById("questions-view").style.display = "block";
        document.getElementById("evaluations-view").style.display = "none";
      });
      switchEvaluations.addEventListener("click", () => {
        switchEvaluations.classList.add("active");
        switchQuestions.classList.remove("active");
        document.getElementById("questions-view").style.display = "none";
        document.getElementById("evaluations-view").style.display = "block";
        loadEvaluations();
      });

      let poller = null;
      function startAdmin() {
        loginView.style.display = "none";
        adminView.style.display = "block";
        renderDayTabs();
        renderTabs();
        loadQuestions();
        if (poller) clearInterval(poller);
        poller = setInterval(loadQuestions, 3000);
      }

      // Auto-login if we already have a passcode from this session.
      (async function init() {
        if (passcode) {
          const ok = await tryLogin(passcode);
          if (ok) startAdmin();
        }
      })();
    })();
  </script>
</body>
</html>
