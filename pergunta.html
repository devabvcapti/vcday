<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enviar pergunta · Congresso ABVCAP 2026</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon-512.png" />
  <link rel="apple-touch-icon" href="assets/favicon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="styles.css?v=13" />
</head>
<body>
  <div class="site-topbar">
    <div class="site-topbar-inner">
      <img src="assets/logo-negativo.png" alt="ABVCAP" class="brand-logo" />
      <div class="lang-toggle" id="lang-toggle"></div>
    </div>
  </div>
  <div class="site-topbar-stripe"></div>
  <div class="wrap">
    <div class="header">
      <span class="eyebrow" id="panel-time">Carregando…</span>
      <h1 id="panel-name">Carregando painel…</h1>
      <p class="speakers" id="panel-speakers" style="display: none;"></p>
    </div>

    <div class="card" style="padding: 22px;" id="form-card">
      <form id="question-form">
        <div class="field">
          <label for="question" id="question-label">Sua pergunta</label>
          <textarea id="question" rows="4" maxlength="500" placeholder="Escreva sua pergunta para o painelista…" required></textarea>
          <div class="hint" id="count-hint">0/500</div>
        </div>
        <div class="field">
          <label for="author"><span id="author-label">Seu nome e empresa</span> <span id="author-optional" style="font-weight: 400; text-transform: none; letter-spacing: normal;">(opcional)</span></label>
          <input type="text" id="author" maxlength="120" placeholder="Ex.: Maria Silva, Fundo XP" />
        </div>
        <input type="text" id="website" name="website" class="honeypot" tabindex="-1" autocomplete="off" />
        <button type="submit" class="btn btn-accent btn-block" id="submit-btn">Enviar pergunta</button>
      </form>
      <div id="success" style="display:none; text-align:center; padding: 12px 0;">
        <h3 style="margin-bottom: 8px;" id="success-title">Pergunta enviada!</h3>
        <p style="color: var(--ink-soft); margin: 0 0 18px;" id="success-text">A pergunta foi enviada para a moderação do painel. Caso seja selecionada, será lida ao painelista.</p>
        <button class="btn btn-ghost btn-block" id="another-btn">Enviar outra pergunta</button>
        <a class="evaluate-link" id="success-evaluate-link" href="#" style="display: block; margin-top: 14px;">Avaliar este painel →</a>
      </div>
    </div>

    <a class="btn btn-ghost btn-block" href="index.html" id="back-link" style="display: block; margin-top: 16px; text-align: center; text-decoration: none;">← Ver todos os painéis</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=18"></script>
  <script>
    (async function () {
      document.documentElement.lang = getLang() === "en" ? "en" : "pt-BR";
      renderLangToggle();
      document.getElementById("question-label").textContent = t("yourQuestion");
      document.getElementById("question").placeholder = t("questionPlaceholder");
      document.getElementById("author-label").textContent = t("yourNameCompany");
      document.getElementById("author-optional").textContent = t("optional");
      document.getElementById("author").placeholder = t("namePlaceholder");
      document.getElementById("submit-btn").textContent = t("sendQuestion");
      document.getElementById("success-title").textContent = t("questionSentTitle");
      document.getElementById("success-text").textContent = t("questionSentText");
      document.getElementById("another-btn").textContent = t("sendAnother");
      document.getElementById("success-evaluate-link").textContent = t("evaluateThisPanel");
      document.getElementById("back-link").textContent = t("footerHome");
      document.getElementById("panel-time").textContent = t("eventName");
      document.title = `${document.title.split(" · ")[0]} · ${t("eventName")}`;

      const panelId = qs("p");
      const nameEl = document.getElementById("panel-name");
      const timeEl = document.getElementById("panel-time");

      if (!panelId) {
        nameEl.textContent = t("panelNotProvided");
        timeEl.textContent = t("scanQr");
        document.getElementById("form-card").style.display = "none";
        return;
      }

      const panel = await fetchPanel(panelId);
      if (!panel) {
        nameEl.textContent = t("panelNotFound");
        document.getElementById("form-card").style.display = "none";
        return;
      }

      nameEl.textContent = panelName(panel);
      timeEl.textContent = `${t("eventName")} · ${formatRange(panel)}`;
      if (panel.speakers) {
        const speakersEl = document.getElementById("panel-speakers");
        speakersEl.textContent = `${t("speakersLabel")}: ${formatSpeakers(panel)}`;
        speakersEl.style.display = "block";
      }
      document.getElementById("success-evaluate-link").href = `avaliacao.html?p=${encodeURIComponent(panel.id)}`;

      if (panelPhase(panel, nowMinutesSaoPaulo()) === "done") {
        timeEl.textContent = `${t("eventName")} · ${formatRange(panel)} ${t("closedSuffix")}`;
        document.getElementById("form-card").innerHTML = `
          <p style="margin: 0 0 14px; color: var(--ink-soft);">${t("panelClosedText")}</p>
          <a class="btn btn-accent btn-block" href="avaliacao.html?p=${encodeURIComponent(panel.id)}" style="display: block; text-align: center; text-decoration: none;">${t("evaluateThisPanel")}</a>
        `;
        return;
      }

      const textarea = document.getElementById("question");
      const countHint = document.getElementById("count-hint");
      textarea.addEventListener("input", () => {
        countHint.textContent = `${textarea.value.length}/500`;
      });

      const form = document.getElementById("question-form");
      const submitBtn = document.getElementById("submit-btn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const website = document.getElementById("website").value;
        if (website) return; // honeypot tripped, silently ignore

        const questionText = textarea.value.trim();
        if (questionText.length < 3) return;
        const author = document.getElementById("author").value.trim();

        submitBtn.disabled = true;
        submitBtn.textContent = t("sending");

        const { error } = await sb.from("vcday_questions").insert({
          panel_id: panel.id,
          question_text: questionText,
          author_name: author || null,
          status: "pending",
        });

        submitBtn.disabled = false;
        submitBtn.textContent = t("sendQuestion");

        if (error) {
          console.error(error);
          alert(t("sendError"));
          return;
        }

        form.style.display = "none";
        document.getElementById("success").style.display = "block";
      });

      document.getElementById("another-btn").addEventListener("click", () => {
        textarea.value = "";
        countHint.textContent = "0/500";
        document.getElementById("success").style.display = "none";
        form.style.display = "block";
      });
    })();
  </script>
</body>
</html>
