<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Telão de perguntas · Congresso ABVCAP 2026</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon-512.png" />
  <link rel="apple-touch-icon" href="assets/favicon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="styles.css?v=13" />
  <style>
    body { padding-inline: 0; }
    .site-topbar-stripe { height: 4px; background: var(--accent); }
    .stage {
      max-width: none;
      margin: 0;
      padding: 40px 56px;
      min-height: 100vh;
    }
    .stage-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 40px;
      gap: 24px;
    }
    .stage-header h1 { font-size: 32px; }
    .stage-header .speakers { font-size: 16px; margin-top: 6px; }
    .stage-header .cta {
      text-align: right;
      color: var(--ink-soft);
      font-size: 16px;
      line-height: 1.5;
    }
    .stage-header .cta .link {
      font-family: "IBM Plex Mono", monospace;
      color: var(--accent);
      font-size: 20px;
      font-weight: 600;
    }
    .stage-header .brand-logo {
      height: 30px;
      margin-bottom: 24px;
    }
    .stage-header .lang-toggle { justify-content: flex-end; margin-bottom: 10px; }
    .stage-header .lang-flag { font-size: 22px; }
    .queue { display: flex; flex-direction: column; gap: 22px; }
    .qcard {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px 32px;
    }
    .qcard .num {
      font-family: "IBM Plex Mono", monospace;
      font-size: 22px;
      color: var(--accent);
      min-width: 44px;
    }
    .qcard .text {
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 30px;
      line-height: 1.35;
      flex: 1;
      text-wrap: balance;
      color: var(--ink);
    }
    .qcard .author {
      display: block;
      margin-top: 14px;
      font-family: "Source Sans 3", sans-serif;
      font-size: 16px;
      color: var(--ink-soft);
      font-weight: 500;
    }
    .empty {
      color: var(--ink-faint);
      font-size: 20px;
      padding: 48px 0;
      text-align: center;
    }
    @media (max-width: 700px) {
      .stage { padding: 24px; }
      .stage-header { flex-direction: column; }
      .stage-header .cta { text-align: left; }
      .qcard .text { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="site-topbar-stripe"></div>
  <div class="stage">
    <div class="stage-header">
      <div>
        <img src="assets/logo-negativo.png" alt="ABVCAP" class="brand-logo" />
        <span class="eyebrow" id="eyebrow-text">Congresso ABVCAP 2026 · Perguntas ao vivo</span>
        <h1 id="panel-name">Carregando…</h1>
        <p class="speakers" id="panel-speakers" style="display: none;"></p>
      </div>
      <div class="cta">
        <div class="lang-toggle" id="lang-toggle"></div>
        <span id="cta-text">Envie sua pergunta em</span><br />
        <span class="link" id="site-link">vcday.abvcap.com.br</span>
      </div>
    </div>
    <div class="queue" id="queue">
      <div class="empty" id="empty-state">Aguardando perguntas aprovadas…</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=19"></script>
  <script>
    (function () {
      document.documentElement.lang = getLang() === "en" ? "en" : "pt-BR";
      renderLangToggle();
      document.getElementById("eyebrow-text").textContent = `${t("eventName")} · ${t("liveQuestionsEyebrow")}`;
      document.title = `${document.title.split(" · ")[0]} · ${t("eventName")}`;
      document.getElementById("cta-text").textContent = t("sendYourQuestionAt");
      document.getElementById("empty-state").textContent = t("waitingApproved");
      document.getElementById("panel-name").textContent = t("loading");
      document.getElementById("site-link").textContent = window.location.host || "este link";

      let panelId = qs("p");
      const nameEl = document.getElementById("panel-name");
      const queueEl = document.getElementById("queue");

      async function resolvePanel() {
        if (panelId) return fetchPanel(panelId);
        const panels = await fetchPanels();
        const chosen = pickDefaultPanel(panels);
        if (chosen) panelId = chosen.id;
        return chosen;
      }

      async function render() {
        const panel = await resolvePanel();
        if (!panel) {
          nameEl.textContent = t("noPanelsRegistered");
          return;
        }
        nameEl.textContent = panelName(panel);
        const speakersEl = document.getElementById("panel-speakers");
        if (panel.speakers) {
          speakersEl.textContent = `${t("speakersLabel")}: ${formatSpeakers(panel)}`;
          speakersEl.style.display = "block";
        } else {
          speakersEl.style.display = "none";
        }

        const { data, error } = await sb
          .from("vcday_questions")
          .select("*")
          .eq("panel_id", panel.id)
          .eq("status", "approved")
          .order("created_at", { ascending: true })
          .limit(5);

        if (error) {
          console.error(error);
          return;
        }

        if (!data.length) {
          queueEl.innerHTML = `<div class="empty">${t("waitingApproved")}</div>`;
          return;
        }

        queueEl.innerHTML = data
          .map((q, i) => `
            <div class="qcard">
              <span class="num">${String(i + 1).padStart(2, "0")}</span>
              <div>
                <div class="text">${escapeHtml(q.question_text)}</div>
                ${q.author_name ? `<span class="author">${escapeHtml(q.author_name)}</span>` : ""}
              </div>
            </div>
          `)
          .join("");
      }

      render();
      setInterval(render, 4000);
    })();
  </script>
</body>
</html>
